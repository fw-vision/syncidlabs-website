name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # Private @fw-vision/* packages resolve via GitHub Packages (.npmrc).
          # Same-org GITHUB_TOKEN is usually enough; if install fails with 401,
          # add a PAT with read:packages as secrets.GITHUB_TOKEN_FWVISION.
          GITHUB_TOKEN_FWVISION: ${{ secrets.GITHUB_TOKEN_FWVISION || secrets.GITHUB_TOKEN }}

      - name: Build
        run: bunx astro build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
